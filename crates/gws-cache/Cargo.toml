[package]
name = "gws-cache"
version = "0.1.0"
edition = "2024"
description = "Transactional Gmail and Google Calendar caching through Google Workspace CLI"
license = "MIT"
authors = ["Alex Gorbatchev"]
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
html-escape = "0.3.0"
mailparse = "0.18.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

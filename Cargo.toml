[package]
name = "gws-cache-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Alex Gorbatchev"]
description = "Searchable offline Gmail and Calendar cache"
publish = false

[[bin]]
name = "gws-cache"
path = "src/main.rs"

[dependencies]
cli-command-kit = { path = "../cli-command-kit" }
gws-cache = { path = "crates/gws-cache" }
chrono = "0.4.45"
clap_complete = "4.6.11"
dirs = "6"
go-duration = "0.2.0"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
comfy-table = "7.2"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true

[workspace]
members = [".","crates/gws-cache"]
default-members = [".","crates/gws-cache"]
resolver = "3"
